<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Embed test — Monitoring preferences POC</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 16px;
        background: #e0e0e0;
      }
      .note {
        max-width: 42rem;
        margin: 0 0 16px;
        font-size: 14px;
        color: #333;
        line-height: 1.45;
      }
      .wix-mobile-shell {
        max-width: 414px;
        margin: 0 auto;
        padding: 24px;
        background: #fafafa;
        border-radius: 12px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      }
      .wix-mobile-shell h2 {
        margin: 0 0 12px;
        font-size: 16px;
      }
      label {
        display: block;
        margin-bottom: 8px;
        font-size: 13px;
      }
      select {
        margin-bottom: 16px;
        padding: 8px;
        font-size: 14px;
      }
      .iframe-host {
        margin: 0 auto;
        border: 2px dashed #888;
        background: #fff;
        overflow: hidden;
      }
      .iframe-host iframe {
        display: block;
        width: 100%;
        height: 960px;
        border: 0;
      }
    </style>
  </head>
  <body>
    <p class="note">
      Outer shell (~414px + padding) mimics a Wix mobile column. The iframe width mimics the
      <strong>usable</strong> embedded content area after Wix gutters—typically ~320–360px, not
      the full phone viewport.
    </p>
    <div class="wix-mobile-shell">
      <h2>Simulated Wix mobile column</h2>
      <label for="w">Iframe content width</label>
      <select id="w" aria-label="Iframe width">
        <option value="320">320px</option>
        <option value="340" selected>340px</option>
        <option value="360">360px</option>
        <option value="390">390px</option>
      </select>
      <div class="iframe-host" id="host">
        <iframe id="poc" src="./index.html" title="Monitoring preferences POC"></iframe>
      </div>
    </div>
    <script>
      const host = document.getElementById("host");
      const sel = document.getElementById("w");
      function apply() {
        host.style.width = sel.value + "px";
        host.style.maxWidth = "100%";
      }
      sel.addEventListener("change", apply);
      apply();
    </script>
  </body>
</html>
